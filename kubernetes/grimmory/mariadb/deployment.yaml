apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: grimmory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grimmory-db-credentials
                  key: db-root-password
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: grimmory-db-credentials
                  key: db-name
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: grimmory-db-credentials
                  key: db-user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grimmory-db-credentials
                  key: db-password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command: ["mariadb-admin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["mariadb-admin", "ping", "-h", "localhost"]
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grimmory-mariadb-data
