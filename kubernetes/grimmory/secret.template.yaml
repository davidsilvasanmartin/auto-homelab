# Template for the Grimmory database secret.
#
# USAGE
#   1. Copy this file:  cp secret.template.yaml secret.yaml
#   2. Fill in real values in secret.yaml
#   3. Apply:           kubectl apply -f kubernetes/grimmory/secret.yaml
#
# secret.yaml is git-ignored. Never commit real credentials.
# The database-url must match the db-name you set below.
apiVersion: v1
kind: Secret
metadata:
  name: grimmory-db-credentials
  namespace: grimmory
type: Opaque
stringData:
  db-name: grimmory
  db-user: grimmory
  db-password: "CHANGE_ME"
  db-root-password: "CHANGE_ME_ROOT"
  database-url: "jdbc:mariadb://mariadb:3306/grimmory"
