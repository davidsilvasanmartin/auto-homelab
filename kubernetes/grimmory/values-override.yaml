# Helm values override for the Grimmory test deployment on Minikube.
# Apply with: helm install grimmory /tmp/grimmory-src/deploy/helm/grimmory \
#               --namespace grimmory --values kubernetes/grimmory/values-override.yaml

# Expose Grimmory outside the cluster via NodePort so you can reach it at
# $(minikube ip):30001 from your browser.
service:
  type: NodePort
  nodePort: 30001

# Use the PVCs we created manually in storage/pvcs.yaml, which point to ./test-data.
# This stops Helm from creating new PVCs backed by Minikube's default provisioner.
persistence:
  data:
    existingClaim: grimmory-app-data
  books:
    existingClaim: grimmory-books

# MariaDB sub-chart configuration.
mariadb:
  auth:
    database: grimmory
    username: grimmory
    # Change these before deploying to a non-test environment.
    password: "ChangeMe_Grimmory_2025!"
    rootPassword: "ChangeMe_MariaDBRoot_2025!"
  primary:
    persistence:
      # Point MariaDB's PVC at the one we created manually.
      existingClaim: grimmory-mariadb
