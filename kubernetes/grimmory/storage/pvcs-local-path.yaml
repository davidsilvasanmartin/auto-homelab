# Alternative PVCs for clusters without extraMounts.
# Uses Kind's built-in local-path-provisioner (StorageClass: standard).
# Data lives at /var/local-path-provisioner/… inside the Kind node container.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-app-data
  namespace: grimmory
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-books
  namespace: grimmory
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-bookdrop
  namespace: grimmory
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-mariadb-data
  namespace: grimmory
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
