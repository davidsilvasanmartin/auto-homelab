# PersistentVolumes for the DEV environment (Minikube on macOS).
#
# Storage is backed by host directories inside the Minikube VM.
# The Go "k8s up" command mounts <project-root>/test-data into the VM at /test-data
# before applying these manifests, so the paths below resolve correctly.
#
# DO NOT apply this file in production. Use pvs.prod.yaml instead.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grimmory-app-data
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /test-data/grimmory/app-data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grimmory-books
spec:
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /test-data/grimmory/books
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grimmory-bookdrop
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /test-data/grimmory/bookdrop
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grimmory-mariadb-data
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /test-data/grimmory/mariadb
