# PersistentVolumeClaims — identical in dev and prod.
#
# storageClassName: "" disables dynamic provisioning and forces static binding
# to a PV whose name matches `volumeName`. The PV files (pvs.dev.yaml or
# pvs.prod.yaml) must be applied before these claims.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-app-data
  namespace: grimmory
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: grimmory-app-data
  resources:
    requests:
      storage: 5Gi
---
