kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      # Exposes ./test-data on your Mac as /test-data inside the Kind node.
      # Run `kind create cluster` from the project root, or replace with an absolute path.
      - hostPath: ./test-data
        containerPath: /test-data
    extraPortMappings:
      # Makes NodePort 30001 reachable at localhost:30001.
      # Remove if you prefer kubectl port-forward.
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
